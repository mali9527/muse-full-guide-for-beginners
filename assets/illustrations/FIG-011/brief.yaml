- C83 「看看有没有我漏掉的要紧事」：它找出一封邮件、起草回复，初稿里多出了一个会面承诺
placement: C83 「看看有没有我漏掉的要紧事」：它找出一封邮件、起草回复，初稿里多出了一个会面承诺
composition: 三张信纸由左上到右上再到下方中央。第一张一行文字会面承诺被圈起，上方标签回复初稿；第二张对应那一行以黑笔划掉，上方标签本人删改；第三张是完成核对的信封，上方标签确认后发送。不填写任何正文句子，其他正文用无字的短横线表示。会面承诺这四字仅第一张出现一次。
