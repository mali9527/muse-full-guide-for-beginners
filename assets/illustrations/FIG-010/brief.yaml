reader_question: 购物车准备好以后？
takeaway: C78 的分工：Muse 参考清单与历史订单准备购物车，分享者自己检查并结账；这不代表所有超市都支持同样流程。
source_sections:
- C78 指给它历史订单，拍一张手写清单，它把超市提货购物车填好了
placement: C78 指给它历史订单，拍一张手写清单，它把超市提货购物车填好了
composition: 三段从上到下的场景。最上方手写清单纸与历史订单小叠纸，标签清单与旧订单；中间一个装着简单商品轮廓的购物车，标签Muse准备；底部两只手，左手放大镜检查购物车，右手拿账单确认，标签本人核对结账。箭头连接三段，不画金额、银行卡号码、真实商店标志或已付款勾。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
content_guard: 本图是依据正文制作的概念或案例流程示意，不是Muse界面、原交付件或实测记录。不能增加产品能力、推定任务成功、增加未给出的品牌或许诺。保留同款1448×1086不透明细方格纸、黑色中性笔和严格中性灰。
