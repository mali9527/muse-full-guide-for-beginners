kind: concept
form: flow
reader_question: 新通知改了哪一项？
takeaway: 本书教学示意：更正通知只改上午安排，不能因此抹去原通知中仍有效的下午安排。
source_sections:
- 多份文件先讲清关系
placement: 多份文件先讲清关系
composition: 左右两张通知纸，汇入下方一张出行单。左上旧通知包含上午和下午两行图形横线；右上更正通知只画一行上午的图形横线。左上标签原通知，右上标签更正通知。下方成果分为上下两行，分别写上午改期、下午保留。从右上连线到上午改期，从左上连线到下午保留，路径不交叉。上部两纸左右安排允许以连线自然为优先；只含四条文字，勿添加虚构日期。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
