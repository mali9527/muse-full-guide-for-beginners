reader_question: 一次任务，多轮推进？
takeaway: 任务通常要经历判断、调用工具、读取结果，再决定下一步；缺少资料、登录或许可时，仍可能需要你接手。
source_sections:
- 任务为什么需要一轮一轮推进
placement: 任务为什么需要一轮一轮推进
composition: 四节点顺时针循环，左上模型判断用便笺与思考线象征，右上调用工具用扳手加网页纸，右下查看结果用放大镜和资料，左下决定下一步用分叉路标。四个节点间各一根明确箭头。左下另有分支到画面底部的小人，标需要时问你；不要脑解剖、服务器复杂结构或隐藏思维过程。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
