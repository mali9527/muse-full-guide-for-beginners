kind: concept
form: relationship
reader_question: 同一信息，几处保留？
takeaway: 删除上传文件，不等于同时清除对话和长期记忆；需要分别检查有关信息是否仍保留。
source_sections:
- 不想让它记住时，处理的是哪一份信息
placement: 不想让它记住时，处理的是哪一份信息
composition: 三个彼此独立、等大的卡片，三角布局。上方是上传的简历纸，左下是对话纸，右下是个人背景笔记。三张卡片分别大字标签上传文件、聊天记录、长期记忆。上方文件旁画小垃圾桶及删除动作短箭头，只作用到上方文件；两个下方卡片仍完整。底部大字标签分别检查。绝对不要画从垃圾桶通向三个对象的箭头，不画一键清除或全部消失。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
