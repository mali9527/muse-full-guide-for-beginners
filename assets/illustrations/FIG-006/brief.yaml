placement: 批准一次，和以后都批准，差在哪里
composition: 三行比较图。第一行单个动作圆点；第二行一个任务圈内三个同类动作圆点；第三行两个并列小框分别代表同一网站与同一连接器，各框内从现在延伸到以后的一列同类动作。第一、二行左侧是大标签，右侧配短说明；第三行大标签以后同类，两个框仅各写网站、连接器。不得把网站与连接器画成包含关系，不使用全局无限授权图像。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
content_guard: 本图是依据正文制作的概念或案例流程示意，不是Muse界面、原交付件或实测记录。不能增加产品能力、推定任务成功、增加未给出的品牌或许诺。保留同款1448×1086不透明细方格纸、黑色中性笔和严格中性灰。
