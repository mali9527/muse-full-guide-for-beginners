placement: C02 做一份全家能一起看的每周简报
composition: 左上两本日历和信封，标签邮件与日历；右上可识别为一页纸的简报，不画真实PDF或声称是原件，标签一页简报。箭头从左上至右上。简报下方放大镜圈出两个重叠的时间条，标签找出冲突。再向左下的两个人商量安排的小景画箭头，标签家人决定。流程左上到右上到右下到左下，图形轻简。
  主标签使用约65px以上的清楚中文手写印刷体，标题约80px，四周留白。仅绘制title和labels；caption、alt及制作说明不得画进图里。
